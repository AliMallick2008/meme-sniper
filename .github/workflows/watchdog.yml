name: watchdog
# Three times an hour: if no bot run is going or waiting, start one. GitHub can delay scheduled jobs when it is busy,
# so a gap can last up to about an hour in the worst case; the bots replay what they missed from 1-minute candles.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the bots if they are not running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh run list -R "$REPO" -w sniper.yml -L 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$n" = "0" ]; then
            gh workflow run sniper.yml -R "$REPO" --ref main
            echo "No bot run was going, so one was started."
          else
            echo "A bot run is going or waiting ($n)."
          fi
